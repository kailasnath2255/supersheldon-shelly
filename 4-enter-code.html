<title>Enter Code – Super Sheldon</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:14px;color:#1a1a2e;background:#fff;}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
input{font:inherit;}

<style>
.login-page{min-height:100vh;background:#efefef;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.login-card{background:#fff;border-radius:4px;padding:36px 32px;width:340px;position:relative;z-index:2;box-shadow:0 2px 16px rgba(0,0,0,0.08);}
.login-card h2{text-align:center;font-size:20px;font-weight:600;margin-bottom:20px;color:#1a1a2e;}
.login-btn{width:100%;padding:11px 16px;border-radius:6px;border:1.5px solid #d1d5db;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;background:#fff;color:#1a1a2e;transition:border-color 150ms;margin-bottom:10px;text-decoration:none;}
.login-btn:hover{border-color:#9ca3af;background:#fafafa;}
.or-divider{text-align:center;color:#9ca3af;font-size:13px;margin:12px 0;}
.create-account{text-align:center;margin-top:16px;font-size:13px;color:#374151;}
.create-account a{color:#1a1a2e;font-weight:600;text-decoration:none;}
.powered-by{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#9ca3af;}
.powered-by a{color:#6b7280;text-decoration:underline;}
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;cursor:pointer;color:#1a1a2e;text-decoration:none;}
.back-row h2{margin:0;text-align:left;}
.field-label{font-size:13px;color:#374151;margin-bottom:6px;font-weight:500;}
.input-wrap{border:1.5px solid #d1d5db;border-radius:6px;overflow:hidden;display:flex;align-items:center;margin-bottom:14px;background:#fff;transition:border-color 150ms;}
.input-wrap:focus-within{border-color:#6b7280;}
.input-wrap input{flex:1;padding:10px 12px;border:none;outline:none;font-size:14px;color:#1a1a2e;background:transparent;}
.input-wrap input::placeholder{color:#9ca3af;}
.flag-prefix{padding:10px 10px 10px 12px;font-size:13px;color:#374151;font-weight:500;display:flex;align-items:center;gap:4px;border-right:1.5px solid #d1d5db;white-space:nowrap;}
.get-code-btn{width:100%;padding:12px;border-radius:6px;background:#1e2130;color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;}
.get-code-btn:hover{background:#2d3148;}
.otp-note{font-size:13px;color:#6b7280;margin-bottom:20px;}
.otp-note span{color:#1a1a2e;font-weight:500;}
.otp-boxes{display:flex;gap:12px;margin-bottom:18px;justify-content:center;}
.otp-box{width:54px;height:54px;border:1.5px solid #d1d5db;border-radius:8px;font-size:20px;font-weight:600;text-align:center;outline:none;color:#1a1a2e;background:#fff;padding:0;transition:border-color 150ms,box-shadow 150ms;}
.otp-box:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,0.15);}
.otp-box[value]:not([value=""]){background:#f9fafb;}
.resend-row{font-size:13px;color:#374151;margin-bottom:20px;}
.resend-row a{color:#2563eb;font-weight:500;text-decoration:none;}
.verify-btn{width:100%;padding:12px;border-radius:6px;background:#9ca3af;color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;}
/* bg illustration shapes */
.illus{position:absolute;pointer-events:none;}
</style>
</head>

<svg class="illus" style="left:60px;bottom:55px;opacity:0.45;" width="50" height="40" viewBox="0 0 50 40"><path d="M5 38 C5 38 10 10 30 5 C30 5 15 20 25 30" fill="#9ca3af"/><path d="M25 38 C25 38 40 10 20 3" fill="#6b7280"/><line x1="15" y1="38" x2="15" y2="20" stroke="#6b7280" stroke-width="1.5"/></svg>

<svg class="illus" style="left:160px;bottom:100px;opacity:0.3;" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#9ca3af" stroke-width="1.5"/></svg>

<div class="login-page">
  <div class="login-card" style="padding:28px 32px;">
    <a class="back-row" id="back-link" href="2-login-phone.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      <h2>Enter Code</h2>
    </a>
    <p class="otp-note">Code sent to <span id="ident">+91 7324962039</span></p>
    <div class="otp-boxes">
      <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code" value="2">
      <input class="otp-box" maxlength="1" inputmode="numeric" value="4">
      <input class="otp-box" maxlength="1" inputmode="numeric" value="7">
      <input class="otp-box" maxlength="1" inputmode="numeric" value="2">
    </div>
    <p class="resend-row">Haven't received the Code? <a href="#" id="resend">Resend Code (<span id="timer">28</span>)</a></p>
    <button id="verify-btn" class="verify-btn">Verify</button>
  </div>
  <div class="powered-by">Powered by Wise &#8211; <a href="#">Tutor Management Software</a></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const { method, identifier } = app.getIdentifier();
if (identifier) document.getElementById('ident').textContent = identifier;
document.getElementById('back-link').href = method === 'email' ? '3-login-email.html' : '2-login-phone.html';

const boxes = Array.from(document.querySelectorAll('.otp-box'));
const verify = document.getElementById('verify-btn');
function code() { return boxes.map(b => b.value).join(''); }
function refresh() {
  const full = code().length === boxes.length;
  verify.style.background = full ? '#1e2130' : '#9ca3af';
  verify.style.cursor = full ? 'pointer' : 'not-allowed';
  verify.disabled = !full;
}
refresh();

boxes.forEach(function (box, i) {
  box.addEventListener('input', function () {
    box.value = box.value.replace(/\D/g, '').slice(0, 1);
    if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    refresh();
  });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      boxes[i - 1].focus();
      boxes[i - 1].value = '';
      refresh();
    }
  });
  box.addEventListener('paste', function (e) {
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    if (!text) return;
    e.preventDefault();
    text.split('').slice(0, boxes.length).forEach((d, idx) => { boxes[idx].value = d; });
    (boxes[Math.min(text.length, boxes.length - 1)] || boxes[0]).focus();
    refresh();
  });
});
boxes[0].focus();

verify.addEventListener('click', function () {
  if (verify.disabled) return;
  // Mark as a fresh first-time sign-in so Shelly runs the onboarding tour
  if (window.db) {
    db.update(function (d) { d.auth.isFirstLogin = true; d.auth.onboardingDone = false; d.shellyChat = []; });
  }
  app.setAuthed(true);
  window.location.href = '5-classes.html';
});

// Resend countdown
const resend = document.getElementById('resend');
resend.addEventListener('click', function (e) { e.preventDefault(); }); // belt-and-braces
let secs = 28;
resend.style.pointerEvents = 'none';
resend.style.opacity = '0.6';
let tick = setInterval(function () {
  secs -= 1;
  const timerEl = document.getElementById('timer');
  if (secs <= 0) {
    clearInterval(tick); tick = null;
    const parent = document.getElementById('resend').parentNode;
    parent.innerHTML = 'Haven\'t received the Code? <a href="#" id="resend">Resend Code</a>';
    parent.querySelector('#resend').addEventListener('click', function (e) {
      e.preventDefault();
      app.toast('Code resent — try 2 4 7 2 again');
    });
    return;
  }
  if (timerEl) timerEl.textContent = secs;
}, 1000);
// Clean up if user navigates away
window.addEventListener('beforeunload', function () { if (tick) clearInterval(tick); });
</script>

</body>
