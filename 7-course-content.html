<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course – Content – Super Sheldon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:14px;color:#1a1a2e;background:#fff;}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
input{font:inherit;}
</style>

<style>
.app-layout{display:flex;min-height:100vh;}
.sidebar{width:220px;min-width:220px;background:#1e2130;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar-logo{padding:16px 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.06);}
.sidebar-logo-icon{width:32px;height:32px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-logo span{font-size:15px;font-weight:600;color:#fff;}
.sidebar-nav{flex:1;padding:8px 0;display:flex;flex-direction:column;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:rgba(255,255,255,0.55);font-size:13.5px;font-weight:400;text-decoration:none;transition:background 150ms,color 150ms;position:relative;}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item svg{flex-shrink:0;opacity:0.7;}
.nav-item.active svg,.nav-item:hover svg{opacity:1;}
.nav-badge{width:8px;height:8px;background:#f97316;border-radius:50%;position:absolute;right:14px;top:50%;transform:translateY(-50%);}
.nav-sub-item{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 36px;color:rgba(255,255,255,0.45);font-size:13px;text-decoration:none;transition:background 150ms,color 150ms;}
.nav-sub-item:hover,.nav-sub-item.active{background:rgba(255,255,255,0.06);color:#fff;}
.nav-sub-item svg{flex-shrink:0;}
.sidebar-account{padding:12px 14px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px;text-decoration:none;}
.account-avatar{width:30px;height:30px;border-radius:50%;background:#4b5563;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.account-label{font-size:13.5px;color:rgba(255,255,255,0.8);font-weight:500;flex:1;}
.account-arrow{color:rgba(255,255,255,0.4);font-size:16px;}
.main-content{flex:1;background:#fff;overflow-y:auto;}

.main-content{flex:1;overflow-y:auto;background:#fff;}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:500;}
.tag.upcoming{background:#dcfce7;color:#166534;}
.tag.cancelled{background:#fee2e2;color:#991b1b;}
.three-dot{color:#9ca3af;font-size:18px;padding:4px 6px;background:none;border:none;cursor:pointer;}
.start-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#1e2130;color:#fff;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;}
.start-btn:hover{background:#2d3148;}
/* course detail header */
.course-detail-header{padding:20px 24px 0;border-bottom:1px solid #e5e7eb;}
.back-link{display:flex;align-items:center;gap:6px;color:#6b7280;font-size:13px;text-decoration:none;margin-bottom:10px;width:fit-content;}
.back-link:hover{color:#1a1a2e;}
.course-detail-title h1{font-size:22px;font-weight:700;color:#1a1a2e;}
.course-detail-title p{font-size:13px;color:#6b7280;margin-top:2px;}
.detail-tabs{display:flex;gap:0;margin-top:16px;}
.dtab{padding:10px 16px;font-size:14px;font-weight:500;color:#6b7280;text-decoration:none;border-bottom:2px solid transparent;transition:all 150ms;display:block;}
.dtab:hover{color:#1a1a2e;}
.dtab.active{color:#1a1a2e;font-weight:600;border-bottom-color:#1a1a2e;}
/* credits panel */
.credits-panel{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;}
.credits-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #e5e7eb;}
.credits-header h4{font-size:14px;font-weight:700;}
.manage-btn{font-size:13px;font-weight:500;padding:5px 10px;border:1px solid #e5e7eb;border-radius:5px;background:#fff;cursor:pointer;}
.credits-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #e5e7eb;}
.credit-cell{padding:12px 16px;border-right:1px solid #e5e7eb;}
.credit-cell:last-child{border-right:none;}
.credit-cell .label{font-size:12px;color:#6b7280;margin-bottom:4px;}
.credit-cell .value{font-size:22px;font-weight:700;}
.credit-log{padding:12px 16px;border-bottom:1px solid #e5e7eb;}
.credit-log-row{display:flex;align-items:flex-start;gap:10px;}
.credit-log-info{flex:1;}
.credit-log-info h5{font-size:13px;font-weight:600;}
.credit-log-info .sub{font-size:12px;color:#6b7280;margin-top:3px;display:flex;align-items:center;gap:6px;}
.credit-plus{font-size:15px;font-weight:700;color:#16a34a;margin-left:auto;padding-top:2px;}
.learner-section,.instructor-section{padding:14px 16px;border-bottom:1px solid #e5e7eb;}
.instructor-section{border-bottom:none;}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.section-heading h4{font-size:13px;font-weight:700;}
.add-link{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:#374151;text-decoration:none;}
.person-row{display:flex;align-items:center;gap:10px;}
.avatar-circle{width:32px;height:32px;border-radius:50%;background:#1e2130;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.person-info h5{font-size:13px;font-weight:600;}
.person-info p{font-size:12px;color:#6b7280;}
/* session list */
.session-list-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #f3f4f6;}
.date-badge{background:#1e2130;color:#fff;border-radius:5px;padding:5px 10px;text-align:center;flex-shrink:0;min-width:46px;}
.date-badge .month{font-size:10px;font-weight:600;text-transform:uppercase;}
.date-badge .day{font-size:18px;font-weight:700;line-height:1.1;}
.session-list-item-info{flex:1;}
.session-list-item-info h5{font-size:13.5px;font-weight:600;}
.session-list-item-info .meta{font-size:11px;color:#9ca3af;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;margin-bottom:2px;}
.session-list-item-info .time{font-size:12px;color:#6b7280;display:flex;align-items:center;gap:4px;margin-bottom:5px;}
.month-divider{font-size:12px;font-weight:700;color:#6b7280;padding:12px 0 6px;text-transform:uppercase;letter-spacing:0.5px;}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal-box{background:#fff;border-radius:8px;width:520px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-box::-webkit-scrollbar{display:none;}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px 14px;border-bottom:1px solid #f3f4f6;}
.modal-header-info h3{font-size:18px;font-weight:700;}
.modal-header-info p{font-size:12px;color:#6b7280;margin-top:3px;}
.modal-close{width:28px;height:28px;border-radius:99px;border:1.5px solid #e5e7eb;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:16px;flex-shrink:0;cursor:pointer;background:#fff;}
.modal-close:hover{background:#f3f4f6;}
.modal-body{padding:20px 24px;}
.modal-session-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f3f4f6;}
.modal-date-badge{background:#1e2130;color:#fff;border-radius:5px;padding:5px 10px;text-align:center;flex-shrink:0;min-width:50px;}
.modal-date-badge .m{font-size:11px;font-weight:600;text-transform:uppercase;}
.modal-date-badge .d{font-size:20px;font-weight:700;line-height:1.1;}
.modal-session-info{flex:1;}
.modal-session-info h4{font-size:15px;font-weight:700;}
.modal-session-info .time{font-size:13px;color:#6b7280;margin-top:3px;}
.modal-section-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #f3f4f6;}
.modal-section-row:last-child{border-bottom:none;}
.modal-icon-box{width:36px;height:36px;border-radius:8px;border:1.5px solid #e5e7eb;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-label{font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.4px;}
.modal-value{font-size:14px;font-weight:600;color:#1a1a2e;margin-top:2px;}
.modal-action-btn{margin-left:auto;display:flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:13px;font-weight:500;background:#fff;color:#374151;flex-shrink:0;cursor:pointer;}
.modal-action-btn:hover{border-color:#9ca3af;}
.private-chip{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid #e5e7eb;border-radius:99px;font-size:12px;color:#6b7280;margin-top:5px;}
.modal-avatar{width:36px;height:36px;border-radius:50%;background:#1e2130;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
</style>
</head>
<body data-page="course-content">
<div class="app-layout">
<div id="sidebar-root"></div>
<div class="main-content">

<div class="course-detail-header">
  <a class="back-link" href="5-classes.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    test
  </a>
  <div class="course-detail-title"><h1>test</h1><p>test</p></div>
  <div class="detail-tabs">
    <a class="dtab " href="6-course-home.html">Home</a>
    <a class="dtab" href="#">Timeline</a>
    <a class="dtab active" href="7-course-content.html">Content</a>
    <a class="dtab" href="#">Billing</a>
    <a class="dtab" href="#">Settings</a>
  </div>
</div>

  <div style="padding:20px 24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h3 style="font-size:16px;font-weight:700;">Content</h3>
      <div style="display:flex;gap:10px;align-items:center;">
        <div style="display:flex;align-items:center;gap:8px;border:1.5px solid #e5e7eb;border-radius:6px;padding:7px 12px;width:200px;background:#fff;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input style="border:none;outline:none;font-size:13px;width:100%;font-family:Inter,sans-serif;" placeholder="Search content">
        </div>
        <button style="display:flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:13px;font-weight:500;background:#fff;cursor:pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Section
        </button>
      </div>
    </div>
    <!-- Section 1 -->
    <div style="border:1.5px solid #e5e7eb;border-radius:8px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;">
        <span style="color:#d1d5db;font-size:16px;cursor:grab;">&#8942;&#8942;</span>
        <div>
          <div style="font-size:14px;font-weight:600;">Section 1</div>
          <div style="font-size:12px;color:#9ca3af;margin-top:2px;">0 Resource</div>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
          <button style="width:30px;height:30px;border-radius:5px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
          <button style="width:30px;height:30px;border-radius:5px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#8942;</button>
          <button style="width:30px;height:30px;border-radius:5px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#8964;</button>
        </div>
      </div>
    </div>
    <!-- Certificates -->
    <div style="border:1.5px solid #e5e7eb;border-radius:8px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:14px;font-weight:600;">Certificates</div>
        <div style="font-size:12px;color:#6b7280;margin-top:3px;">Reward learner achievements</div>
      </div>
      <button style="display:flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:13px;font-weight:500;background:#fff;cursor:pointer;">
        Create
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</div>
</div>
<script src="data.js"></script>
<script src="sidebar.js"></script>
<script src="app.js"></script>
<script>
// "Add Section" → append a new section
const addBtns = document.querySelectorAll('button');
addBtns.forEach(function (b) {
  if (b.textContent.trim().startsWith('Add Section')) {
    b.addEventListener('click', function () {
      const list = b.closest('div').parentElement.parentElement;
      const sections = document.querySelectorAll('[data-section]');
      const n = sections.length + 1;
      const certBlock = document.querySelector('[data-section-list]');
      const target = certBlock || list;
      const div = document.createElement('div');
      div.setAttribute('data-section', '');
      div.style.cssText = 'border:1.5px solid #e5e7eb;border-radius:8px;margin-bottom:12px;';
      div.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:14px 16px;"><span style="color:#d1d5db;font-size:16px;cursor:grab;">⋮⋮</span><div><div style="font-size:14px;font-weight:600;">Section ' + n + '</div><div style="font-size:12px;color:#9ca3af;margin-top:2px;">0 Resource</div></div></div>';
      target.insertBefore(div, target.querySelector('[data-cert]') || null);
      app.toast('Section added');
      if (window.shelly) {
        if (n === 2) {
          shelly.say('Great start! <strong>Section 1</strong> is ready. Now add your first resource — a video, PDF, or quiz. Students learn best with a mix! 📹');
        } else {
          shelly.say('<strong>Section ' + (n - 1) + '</strong> added. Keep building — small chunks make a great course. 👏');
        }
      }
    });
  }
  if (b.textContent.trim() === 'Create') {
    b.addEventListener('click', function () {
      app.modal('Design a certificate',
        app.field('Certificate title', { id: 'cert-title', placeholder: 'e.g. Certificate of Completion', value: 'Certificate of Completion' }) +
        app.field('Awarded by', { id: 'cert-by', placeholder: 'Your school name', value: (window.db ? db.get().me.name : '') }) +
        app.field('Issue at', { id: 'cert-trigger', type: 'select', options: [
          { value: '100', label: 'On 100% course completion' },
          { value: '80',  label: 'At 80% completion' },
          { value: 'manual', label: 'Manually issued by instructor' },
        ] }) +
        '<div style="margin-top:14px;padding:18px;border:2px dashed #c4b5fd;border-radius:10px;background:#faf5ff;text-align:center;">' +
          '<div style="font-size:11px;font-weight:700;color:#7c3aed;letter-spacing:1px;text-transform:uppercase;">Preview</div>' +
          '<div style="font-size:18px;font-weight:800;margin-top:8px;">🎓 Certificate of Completion</div>' +
          '<div style="font-size:12px;color:#6b7280;margin-top:6px;">Awarded to <em>[Learner name]</em> for outstanding work</div>' +
        '</div>',
        { width: 480, actions: [
          { label: 'Cancel' },
          { label: 'Save certificate', primary: true, onClick: function () {
            app.toast('Certificate live — auto-issues on completion ✅');
            if (window.shelly) shelly.say('Certificate is set up! 🎓 Learners who hit the threshold will get it automatically.');
          } },
        ] }
      );
    });
  }
});

// mark existing section / certificate blocks so insert order works
const existing = document.querySelectorAll('div[style*="border:1.5px solid #e5e7eb"][style*="border-radius:8px"]');
let parent = null;
existing.forEach(function (el) {
  parent = el.parentElement;
  if (el.textContent.includes('Section 1')) el.setAttribute('data-section', '');
  if (el.textContent.includes('Certificates')) el.setAttribute('data-cert', '');
});
if (parent) parent.setAttribute('data-section-list', '');

// Search filter
const search = document.querySelector('input[placeholder="Search content"]');
if (search) {
  search.addEventListener('input', function () {
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll('[data-section]').forEach(function (s) {
      s.style.display = !q || s.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}
</script>
<script src="shelly.js"></script>
<script>
// Shelly nudges on the content tab.
window.addEventListener('load', function () {
  const ctxCourse = (db.get().courses.find(function (c) { return c.type === '1on1'; }) || {}).id;
  shelly.context({ page: 'course-content', courseId: ctxCourse });
  const sections = document.querySelectorAll('[data-section]');
  const hasResources = Array.from(sections).some(function (s) { return !s.textContent.includes('0 Resource'); });
  if (!hasResources) {
    shelly.say(
      "This course has <strong>no content yet</strong>! Want to add your first lesson? Click <em>+ Add Section</em> to get started. 👋",
      {
        delay: 700,
        actions: [
          { label: 'Add a section', primary: true, onClick: function () {
            const addBtn = Array.from(document.querySelectorAll('button')).find(function (b) { return b.textContent.trim().startsWith('Add Section'); });
            if (addBtn) addBtn.click();
          } },
          { label: 'Later' },
        ],
      }
    );
  } else {
    shelly.say("Nice — your course has content. Want me to suggest a quiz to test what students learn? 💡");
  }
});
</script>
